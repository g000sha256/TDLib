name: Release

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git identity
        run: bash .github/scripts/configure-git.sh

      - name: Create tags and releases for new versions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

        run: bash .github/scripts/create-releases.sh
