name: Publish releases

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set Git identity
        run: bash .github/scripts/configure-git.sh

      - name: Create version tags and publish releases
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

        run: bash .github/scripts/create-releases.sh
