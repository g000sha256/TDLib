name: Publish releases
run-name: Publish releases

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set Git identity
        run: bash .github/scripts/configure-git.sh

      - name: Fetch upstream changes
        run: bash .github/scripts/fetch-upstream.sh

      - name: Create version tags and publish releases
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PREVIOUS_MAIN: ${{ github.event.before }}

        run: bash .github/scripts/create-releases.sh
