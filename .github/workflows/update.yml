name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set Git identity
        run: bash .github/scripts/configure-git.sh

      - name: Fetch upstream changes
        run: bash .github/scripts/fetch-upstream.sh

      - name: Merge and push upstream changes
        run: bash .github/scripts/merge-upstream.sh
