name: Update

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Georgii Ippolitov"
          git config user.email "github@g000sha256.dev"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/tdlib/td.git
          git fetch upstream

      - name: Merge upstream/master into master
        run: |
          git checkout -B master origin/master
          git merge upstream/master -m "Merge branch 'upstream/master' into 'origin/master'"
          git push origin master
