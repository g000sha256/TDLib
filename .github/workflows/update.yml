name: Update

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git identity
        run: bash .github/scripts/configure-git.sh

      - name: Add upstream remote and fetch
        run: bash .github/scripts/fetch-upstream.sh

      - name: Merge upstream/master into main
        run: bash .github/scripts/merge-upstream.sh
